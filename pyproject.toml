[project]
name = "conferejus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leonardo Lucarelli Navarro", email = "leonardolucanavarro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
